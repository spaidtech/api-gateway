name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test API Gateway
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Multi-Tenant API Platform
      APP_ENV: testing
      DEBUG: "false"

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/api_platform
      REDIS_URL: redis://localhost:6379/0

      JWT_SECRET_KEY: ci-testing-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""

      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""

      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PUBLISHABLE_KEY: ""

      FRONTEND_URL: http://localhost:3000
      PAYMENT_SUCCESS_URL: http://localhost:3000/payments/success
      PAYMENT_CANCEL_URL: http://localhost:3000/payments/cancel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migration
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/api-gateway:latest \
            -t ghcr.io/${{ github.repository_owner }}/api-gateway:${{ github.sha }} \
            .

          docker push ghcr.io/${{ github.repository_owner }}/api-gateway:latest
          docker push ghcr.io/${{ github.repository_owner }}/api-gateway:${{ github.sha }}


  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            set -e

            cd ~/api-gateway

            echo "Updating repository..."
            git pull --ff-only origin main

            echo "Pulling latest Docker image..."
            docker compose pull

            echo "Running database migrations..."
            docker compose run --rm api-gateway alembic upgrade head

            echo "Restarting application..."
            docker compose up -d

            echo "Checking application health..."
            sleep 5
            curl --fail http://localhost:8001/health/

            echo "Deployment successful!"
